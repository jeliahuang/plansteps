[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeliahuang-plansteps"
version = "0.1.0"
description = "统计规划步数、预计耗时与实际执行的偏差，标出明显超预期的规划"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jeliahuang" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jeliahuang.github.io"
Repository = "https://github.com/jeliahuang/plansteps"
Issues = "https://github.com/jeliahuang/plansteps/issues"

[project.scripts]
plansteps = "plansteps:main"

[tool.setuptools]
py-modules = ["plansteps"]
